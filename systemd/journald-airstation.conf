# Installed by `make init` / `make deploy` as /etc/systemd/journald.conf.d/airstation.conf
# Keep the system journal on the SD card across reboots, so `make export` can
# show what the kernel and NetworkManager said before a crash or a Wi-Fi
# drop (the previous boot's log is lost with the default runtime journal).
# Capped at 200 MB; journald writes a few MB a day here.
[Journal]
Storage=persistent
SystemMaxUse=200M
