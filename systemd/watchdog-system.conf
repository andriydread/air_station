# Installed to /etc/systemd/system.conf.d/watchdog.conf by
# systemd/enable-watchdog.sh (run by `make init`).
#
# With dtparam=watchdog=on the BCM SoC hardware watchdog is armed and
# systemd pets it; a hard kernel freeze reboots the Pi within 15s
# instead of waiting for someone to pull the plug.
[Manager]
RuntimeWatchdogSec=15
RebootWatchdogSec=2min
