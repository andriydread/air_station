# Air Station settings, read by all three apps at startup. Run `make restart` after editing.
# Anything not here is a constant in the code that uses it.

[location]
latitude = 49.842957        # used for the weather forecast only
longitude = 24.031111
altitude_m = 296            # SCD41 fallback when no weather pressure is known

[sensors]
scd41_temp_offset_c = 4.0   # factory default; tune against the SHT41
sht41_temp_offset_c = 0.0
asc = false                 # SCD41 automatic self-calibration
calibration_target_ppm = 420

[retention_days]
raw = 30                    # 10-second raw rows
vitals = 30
events = 30
commands = 30
logs = 30                   # one log file per app per day
# hourly rows are kept forever

[weather]
block_hours = 3             # width of the three forecast columns

[dashboard]
port = 8080

[paths]
database = "data/airstation.db"
logs = "data/logs"

[logging]
level = "info"              # "debug" adds request and probe lines
